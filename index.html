
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector QR - BITAZETA</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      box-sizing: border-box;
    }

    h2 {
      color: #0d9488;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      background: white;
      color: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .btn {
      background-color: #f97316;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      font-size: 16px;
    }

    .btn:hover {
      background-color: #ea580c;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    #diagnostico {
      width: 100%;
      max-width: 600px;
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #1e293b;
      color: #cbd5e1;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-sizing: border-box;
      font-size: 12px;
    }
  </style>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>

<body>
  <h2>ESCANEAR AZETA</h2>
  <p>Apunte la cámara al código QR de la carpeta física.</p>

  <div id="reader"></div>

  <div id="status" style="color:#cbd5e1;">
    Esperando autorización de BITAZETA...
  </div>

  <div id="diagnostico">Diagnóstico: página cargada. Esperando mensajes.</div>

  <button
    class="btn"
    id="btn-restart"
    style="display:none;"
    onclick="iniciarEscaner()">
    VOLVER A ESCANEAR
  </button>

  <script>
    let html5QrcodeScanner = null;
    let autorizado = false;
    let iniciando = false;
    let lecturaProcesada = false;
    let origenBitazeta = '';

    const statusEl = document.getElementById('status');
    const diagnosticoEl = document.getElementById('diagnostico');
    const restartBtn = document.getElementById('btn-restart');

    function mostrarEstado(texto, color) {
      statusEl.textContent = texto;
      statusEl.style.color = color;
    }

    function registrarDiagnostico(texto) {
      const hora = new Date().toLocaleTimeString();
      const linea = '[' + hora + '] ' + texto;

      diagnosticoEl.textContent += '\n' + linea;
      console.log('[BITAZETA QR DIAGNÓSTICO]', linea);
    }

    // Aceptar únicamente orígenes HTTPS conocidos de Google Apps Script,
    // incluidos los subdominios dinámicos usados por HTML Service.
    function esOrigenAppsScript(origen) {
      try {
        const url = new URL(origen);
        const host = url.hostname.toLowerCase();

        const esGoogleAppsScript =
          host === 'script.google.com' ||
          host === 'script.googleusercontent.com' ||
          host.endsWith('.script.googleusercontent.com') ||
          host.endsWith('-script.googleusercontent.com');

        return url.protocol === 'https:' && esGoogleAppsScript;
      } catch (error) {
        return false;
      }
    }

    window.addEventListener('message', function(event) {
      const tipo = event.data && event.data.type
        ? String(event.data.type)
        : '(sin tipo de mensaje)';

      registrarDiagnostico(
        'Mensaje recibido. origen=' + event.origin +
        ' | esOpener=' + (event.source === window.opener) +
        ' | hayOpener=' + Boolean(window.opener) +
        ' | tipo=' + tipo
      );

      if (!window.opener) {
        registrarDiagnostico(
          'RECHAZADO: esta ventana no tiene opener.'
        );
        return;
      }

      if (event.source !== window.opener) {
        registrarDiagnostico(
          'RECHAZADO: el mensaje no proviene de la ventana que abrió el lector.'
        );
        return;
      }

      if (!esOrigenAppsScript(event.origin)) {
        registrarDiagnostico(
          'RECHAZADO: el origen no está en la lista permitida de Google Apps Script.'
        );

        mostrarEstado(
          'Se recibió un mensaje, pero el origen no fue reconocido. Revise el diagnóstico.',
          '#fbbf24'
        );
        return;
      }

      if (
        !event.data ||
        event.data.type !== 'BITAZETA_QR_AUTH' ||
        event.data.autorizado !== true
      ) {
        registrarDiagnostico(
          'Mensaje ignorado: no contiene una autorización válida.'
        );
        return;
      }

      origenBitazeta = event.origin;

      if (autorizado) {
        registrarDiagnostico(
          'La autorización ya se había recibido.'
        );
        return;
      }

      autorizado = true;

      registrarDiagnostico(
        'AUTORIZACIÓN ACEPTADA. Se iniciará el lector.'
      );

      mostrarEstado(
        'BITAZETA autorizó el acceso. Iniciando cámara...',
        '#10b981'
      );

      iniciarEscaner();
    });

    function onScanSuccess(decodedText) {
      if (!autorizado || lecturaProcesada) return;

      lecturaProcesada = true;
      restartBtn.style.display = 'none';

      mostrarEstado(
        'Código detectado: ' + decodedText +
        '\nEnviando a BITAZETA...',
        '#10b981'
      );

      if (
        window.opener &&
        origenBitazeta &&
        !window.opener.closed
      ) {
        window.opener.postMessage(
          {
            type: 'AZ_SCAN',
            code: decodedText
          },
          origenBitazeta
        );

        registrarDiagnostico(
          'Código QR enviado a BITAZETA.'
        );

        restartBtn.style.display = 'inline-block';
      } else {
        lecturaProcesada = false;

        mostrarEstado(
          'No se pudo comunicar con BITAZETA. Cierre el lector y ábralo nuevamente desde la aplicación.',
          '#ef4444'
        );

        registrarDiagnostico(
          'ERROR: no hay una ventana BITAZETA disponible para devolver el código.'
        );
      }

      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().catch(function() {});
      }
    }

    function onScanFailure(error) {
      // Ignorar errores de lectura de fotogramas.
    }

    function iniciarEscaner() {
      if (!autorizado) {
        mostrarEstado(
          'Acceso no autorizado. Abra el lector desde BITAZETA.',
          '#ef4444'
        );

        registrarDiagnostico(
          'Inicio de cámara bloqueado: falta autorización.'
        );
        return;
      }

      if (iniciando) return;

      iniciando = true;
      lecturaProcesada = false;
      restartBtn.style.display = 'none';

      mostrarEstado(
        'Solicitando acceso a la cámara...',
        '#cbd5e1'
      );

      if (typeof Html5QrcodeScanner === 'undefined') {
        iniciando = false;

        mostrarEstado(
          'No se pudo cargar la librería del lector QR. Compruebe su conexión a Internet y recargue la página.',
          '#ef4444'
        );

        registrarDiagnostico(
          'ERROR: Html5QrcodeScanner no está disponible.'
        );
        return;
      }

      try {
        html5QrcodeScanner = new Html5QrcodeScanner(
          'reader',
          {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            rememberLastUsedCamera: true
          },
          false
        );

        html5QrcodeScanner.render(
          function(decodedText, decodedResult) {
            iniciando = false;
            onScanSuccess(decodedText, decodedResult);
          },
          onScanFailure
        );

        mostrarEstado(
          'Seleccione la cámara y permita el acceso cuando el navegador lo solicite.',
          '#cbd5e1'
        );

        registrarDiagnostico(
          'Lector inicializado; esperando permiso y lectura.'
        );
      } catch (error) {
        iniciando = false;

        mostrarEstado(
          'No se pudo iniciar el lector: ' +
          (error && error.message
            ? error.message
            : String(error)),
          '#ef4444'
        );

        registrarDiagnostico(
          'ERROR al iniciar lector: ' +
          (error && error.message
            ? error.message
            : String(error))
        );
      }
    }

    window.addEventListener('load', function() {
      registrarDiagnostico(
        'Página cargada. URL=' + location.href
      );

      registrarDiagnostico(
        'Origen propio=' + location.origin
      );

      registrarDiagnostico(
        'Tiene opener=' + Boolean(window.opener)
      );

      if (!window.opener) {
        mostrarEstado(
          'Abra el lector desde BITAZETA para autorizar el acceso.',
          '#ef4444'
        );

        registrarDiagnostico(
          'AVISO: abrir esta URL directamente no autoriza la sesión.'
        );
        return;
      }

      mostrarEstado(
        'Esperando autorización de BITAZETA...',
        '#cbd5e1'
      );
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BITAZETA · Escáner QR</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#reader{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(76vw,58vh,440px)!important;height:min(76vw,58vh,440px)!important;aspect-ratio:1/1;background:#000;overflow:hidden;border:0;border-radius:10px}
/* Fuerza un visor cuadrado incluso si la cámara entrega vídeo panorámico */
#reader>div,#reader__scan_region{width:100%!important;height:100%!important;min-width:0!important;min-height:0!important;max-width:100%!important;max-height:100%!important;overflow:hidden!important}
#reader__scan_region{display:flex!important;align-items:center;justify-content:center}
#reader video,#reader__scan_region video{display:block!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:cover!important}
#reader__scan_region canvas{max-width:100%!important;max-height:100%!important}
#estado{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);max-width:92vw;padding:7px 11px;border-radius:7px;background:#111d;color:#fff;font-size:12px;text-align:center;display:none;z-index:10}
#estado.visible{display:block}
#reader__dashboard,#reader__dashboard_section,#reader__dashboard_section_csr,#reader__camera_selection{display:none!important}
#reader__scan_region img{display:none!important}
</style>
</head>
<body>
<div id="reader" aria-label="Escáner QR"></div>
<div id="estado" role="status"></div>
<script>
(function(){
  const estado=document.getElementById('estado');
  let autorizado=false,origenPadre='',lector=null,iniciando=false,iniciado=false,procesando=false;
  function status(t,visible){estado.textContent=t;estado.className=visible?'visible':'';}
  function origenPermitido(origin){try{const u=new URL(origin);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname.endsWith('.googleusercontent.com'));}catch(e){return false;}}
  function cerrarVentana(){
    // BITAZETA abre esta ventana con window.open, por lo que el navegador permite cerrarla.
    window.close();
    // Respaldo visual si el navegador impide el cierre automático.
    setTimeout(function(){if(!window.closed)status('Código enviado. Puede cerrar esta ventana.',true);},350);
  }
  async function iniciarAutomatico(){
    if(!autorizado||iniciando||iniciado)return;
    iniciando=true;
    try{
      if(typeof Html5Qrcode==='undefined')throw new Error('No se pudo cargar el lector QR.');
      lector=new Html5Qrcode('reader',{verbose:false,formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
      const opciones={fps:24,qrbox:function(w,h){const s=Math.floor(Math.min(w,h,280));return {width:s,height:s};},aspectRatio:1.0,disableFlip:false};
      const leido=async function(decoded){
        if(procesando)return;
        const code=String(decoded||'').trim();if(!code)return;
        procesando=true;
        try{if(lector&&lector.isScanning)await lector.stop();}catch(e){}
        try{
          if(window.opener&&!window.opener.closed){
            window.opener.postMessage({type:'AZ_SCAN',code:code},origenPadre);
            cerrarVentana();
          }else{status('BITAZETA ya no está abierta.',true);}
        }catch(e){status('No se pudo enviar el código a BITAZETA.',true);}
      };
      // Intenta la cámara frontal/normal del PC sin mostrar una lista de cámaras.
      try{await lector.start({facingMode:'user'},opciones,leido,function(){});}
      catch(e){await lector.start({facingMode:'environment'},opciones,leido,function(){});}
      iniciado=true;
    }catch(e){
      const m=String(e&&e.message||e||'');
      status(/permission|notallowed|denied/i.test(m)?'Permita el acceso a la cámara en Chrome y vuelva a abrir el escáner.':'No se pudo iniciar la cámara. Revise el permiso del navegador.',true);
    }finally{iniciando=false;}
  }
  window.addEventListener('message',function(e){
    if(e.source!==window.opener||!e.data||e.data.type!=='BITAZETA_QR_AUTH')return;
    if(!origenPermitido(e.origin)){status('No se pudo validar la ventana de BITAZETA.',true);return;}
    if(e.data.autorizado!==true){status('Sesión no autorizada.',true);return;}
    origenPadre=e.origin;autorizado=true;iniciarAutomatico();
  });
})();
</script>
</body>
</html>
